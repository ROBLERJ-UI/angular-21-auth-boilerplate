<h1 class="h4 text-gray-900 mb-4">Login</h1>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
        <input type="text" formControlName="email" class="form-control form-control-user"
            [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" placeholder="Email Address" />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <div *ngIf="f['email'].errors['required']">Email is required</div>
            <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
        </div>
    </div>
    <div class="form-group">
        <input type="password" formControlName="password" class="form-control form-control-user"
            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" placeholder="Password" />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
            <div *ngIf="f['password'].errors['required']">Password is required</div>
        </div>
    </div>
    <button [disabled]="loading" class="btn btn-primary btn-user btn-block">
        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
        Login
    </button>
    <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{error}}</div>
</form>
<div class="mt-3">
    <a routerLink="/account/forgot-password">Forgot Password?</a>
</div>
<div class="mt-2">
    <a routerLink="/account/register">Register</a>
</div>
