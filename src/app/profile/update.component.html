<h4>Update Profile</h4>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
        <select formControlName="title" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['title'].errors }">
            <option value="">Title...</option>
            <option value="Mr">Mr</option>
            <option value="Mrs">Mrs</option>
            <option value="Miss">Miss</option>
            <option value="Ms">Ms</option>
        </select>
    </div>
    <div class="form-group">
        <input type="text" formControlName="firstName" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['firstName'].errors }" placeholder="First Name" />
        <div *ngIf="submitted && f['firstName'].errors" class="invalid-feedback">First Name is required</div>
    </div>
    <div class="form-group">
        <input type="text" formControlName="lastName" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['lastName'].errors }" placeholder="Last Name" />
        <div *ngIf="submitted && f['lastName'].errors" class="invalid-feedback">Last Name is required</div>
    </div>
    <div class="form-group">
        <input type="text" formControlName="email" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" placeholder="Email" />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">Valid email is required</div>
    </div>
    <h5 class="mt-3">Change Password</h5>
    <p><em>Leave blank to keep the same password</em></p>
    <div class="form-group">
        <input type="password" formControlName="password" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" placeholder="New Password" />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
            <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
        </div>
    </div>
    <div class="form-group">
        <input type="password" formControlName="confirmPassword" class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['confirmPassword'].errors }" placeholder="Confirm Password" />
        <div *ngIf="submitted && f['confirmPassword'].errors" class="invalid-feedback">
            <div *ngIf="f['confirmPassword'].errors['mustMatch']">Passwords must match</div>
        </div>
    </div>
    <div class="form-group mt-3">
        <button [disabled]="loading" class="btn btn-primary mr-2">
            <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
            Save
        </button>
        <a routerLink=".." class="btn btn-secondary">Cancel</a>
        <button type="button" (click)="onDelete()" [disabled]="deleting" class="btn btn-danger float-right">
            <span *ngIf="deleting" class="spinner-border spinner-border-sm mr-1"></span>
            Delete Account
        </button>
    </div>
    <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{error}}</div>
</form>
